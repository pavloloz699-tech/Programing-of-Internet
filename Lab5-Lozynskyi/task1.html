<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Завдання 1 — розбір e-mail регулярним виразом</title>
</head>
<body>
<h3>Розбір e-mail на частини</h3>
<script>
// Рядок, який перевіряємо (змінюйте на будь-який e-mail)
let s = "dwbyu@mail.ua";
 
// Регулярний вираз:
// ^                    початок рядка
// ([a-z0-9]+)          група 1: перше слово локальної частини (до @)
// (\.[a-z0-9]+)*       група 2: решта локальної частини (.слово), 0 або більше разів
// @                    сам символ @
// ([a-z0-9]+)          група 3: перше слово домену
// (\.[a-z0-9]+)*       група 4: решта домену (.слово), 0 або більше разів
// $                    кінець рядка
// прапорець i          не розрізняти великі/маленькі літери
let r = /^([a-z0-9]+)(\.[a-z0-9]+)*@([a-z0-9]+)(\.[a-z0-9]+)*$/i;
 
// match повертає масив: a[0] - весь збіг, a[1..4] - групи в дужках.
// Якщо рядок не підходить, повертається null.
let a = s.match(r);
 
if (a === null) {
  document.writeln("<b>Рядок не є коректним e-mail</b>");
} else {
  for (let i = 0; i < a.length; i++) {
    document.writeln("<hr> a[" + i + "] " + a[i]);
  }
}
</script>
</body>
</html>
