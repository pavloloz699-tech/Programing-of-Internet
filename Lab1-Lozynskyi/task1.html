    <h3>Завдання 4</h3>
    <p>Розгалужений обчислювальний процес</p>
    <form>
        <label for="xValue">x:</label>
        <input type="number" id="xValue" value="2"><br><br>

        <label for="yValue">y:</label>

    <p id="result">Результат: </p>

    <script>
        document.write("Привіт! Мене звати Лозинський Павло Олександрович студент групи ІПЗ-22 Мій Порядковий номер 19");
        
        function calculation() {
            let x= 12;
            let y= 5;
            let f =Math.pow(x, 3) + Math.pow(x, 2) + x + x*Math.pow(y, 2);
           
            alert(`Результат обчислення: ${f}`);

        }

        function calculateBranch() {
            const x = Number(document.getElementById('xValue').value);
            const y = Number(document.getElementById('yValue').value);
            let F;

            if (x > 0 && y > 0) {
                F = 2 * x + x * y + x * x;
            } else if (x !== 0 && ((2 * x + y) / 2) !== 0) {
                F = y / (2 * x);
            } else {
                F = x * x;
            }

            document.getElementById('result').textContent = 'Результат: F = ' + F;
        }

        function fun(a) {
            main_form.t_res.value = a;
        }

        function fun1(a) {
            main_form.t_res2.value = a;
        }

        function calculateSeries() {
            const x = Number(document.getElementById('xSeries').value);
            const y = Number(document.getElementById('ySeries').value);
            let sum = 0;

            for (let i = 3; i <= 7; i++) {
                sum += Math.pow(-1, i + 1) * ((1 - x * Math.pow(y, 2)) / (i + 12));
            }

            document.getElementById('seriesResult').textContent = 'Результат: S = ' + sum.toFixed(6);
        }
    </script>
